name: Build

# Builds DogeBuddy.exe on GitHub's own Windows machines from the public source.
# - Every push / pull request: compile check, exe kept as a workflow artifact.
# - Publishing a GitHub Release: the exe, its SHA-256 hash and a signed
#   build-provenance attestation are attached to that release automatically.

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write       # upload files to the release
  id-token: write       # needed for the provenance attestation
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: build.bat

      - name: Hash
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\DogeBuddy.exe -Algorithm SHA256).Hash.ToLower()
          "$h  DogeBuddy.exe" | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: DogeBuddy
          path: |
            dist/DogeBuddy.exe
            dist/SHA256SUMS.txt

      - name: Attest build provenance
        if: github.event_name == 'release'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/DogeBuddy.exe

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DogeBuddy.exe
            dist/SHA256SUMS.txt
